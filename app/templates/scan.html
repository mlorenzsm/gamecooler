{% extends "base.html" %}
{% block content %}

<h2 class="page-title">{{ t("Scannen") }}</h2>

<div class="toolbar mb-4">
  <label class="inline-check">
    <input type="radio" name="mode" value="consume" checked> {{ icon('package') }}{{ t("Entnahme") }}
  </label>
  <label class="inline-check">
    <input type="radio" name="mode" value="sell"> {{ icon('shopping-bag') }}{{ t("Verkauf") }}
  </label>
</div>
<p id="mode-hint">{{ t("QR-Etikett vor die Kamera halten — das Teilstück wird aus dem Bestand ausgetragen.") }}</p>

<div id="reader" class="scanner"></div>

<div class="mt-4" id="result"></div>

<form method="post" action="/sell" id="basket-form" class="mt-4" hidden>
  <h3>{{ icon('shopping-bag') }}{{ t("Warenkorb") }}</h3>
  <ul id="basket"></ul>
  <p><b id="basket-summary"></b></p>
  <button type="submit" class="print">
    {{ icon('shopping-bag') }}{{ t("{n} Teilstücke verkaufen", n='<span id="basket-count"></span>') | safe }}
  </button>
</form>

<h3>{{ t("Zuletzt entnommen") }}</h3>
<ul id="log"></ul>

<script src="/static/html5-qrcode.min.js"></script>
<script>
const T = {{ {
  "{n} Stk.": t("{n} Stk."),
  "ohne Gewicht": t("ohne Gewicht"),
  "ohne Preis": t("ohne Preis"),
  "{n} ohne Gewicht": t("{n} ohne Gewicht"),
  "{n} ohne Preis": t("{n} ohne Preis"),
  "{n} Teilstücke, {total} €": t("{n} Teilstücke, {total} €"),
  "Aus dem Warenkorb entfernen": t("Aus dem Warenkorb entfernen"),
  "Kein gültiger Etiketten-Code": t("Kein gültiger Etiketten-Code"),
  "Bereits entnommen am {date}:": t("Bereits entnommen am {date}:"),
  "Im Warenkorb:": t("Im Warenkorb:"),
  "Schon im Warenkorb:": t("Schon im Warenkorb:"),
  "Entnommen:": t("Entnommen:"),
  "Fehler — Verbindung prüfen": t("Fehler — Verbindung prüfen"),
  "QR-Etiketten scannen und in den Warenkorb legen — dann Verkauf abschließen.": t("QR-Etiketten scannen und in den Warenkorb legen — dann Verkauf abschließen."),
  "QR-Etikett vor die Kamera halten — das Teilstück wird aus dem Bestand ausgetragen.": t("QR-Etikett vor die Kamera halten — das Teilstück wird aus dem Bestand ausgetragen."),
  "Kamera erfordert HTTPS oder localhost — Seite über http://localhost:8010/scan öffnen.": t("Kamera erfordert HTTPS oder localhost — Seite über http://localhost:8010/scan öffnen."),
  "Keine Kamera gefunden": t("Keine Kamera gefunden"),
  "Kamera konnte nicht gestartet werden: {error}": t("Kamera konnte nicht gestartet werden: {error}"),
  "Kamerazugriff für den Browser erlauben (macOS: Systemeinstellungen → Datenschutz & Sicherheit → Kamera).": t("Kamerazugriff für den Browser erlauben (macOS: Systemeinstellungen → Datenschutz & Sicherheit → Kamera)."),
} | tojson }};
const DEC = {{ decimal_separator() | tojson }};
// For translated text put into innerHTML.
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
}
const resultEl = document.getElementById('result');
const logEl = document.getElementById('log');
const basketForm = document.getElementById('basket-form');
const basketEl = document.getElementById('basket');
let lastScan = { text: null, at: 0 };
const basket = new Map();

function fmt(n, d = 2) { return n.toFixed(d).replace('.', DEC); }
function amount(p) {
  if (p.pieces != null) return T['{n} Stk.'].replace('{n}', p.pieces);
  return p.weight_kg == null ? T['ohne Gewicht'] : `${fmt(p.weight_kg, 3)} kg`;
}
function mode() { return document.querySelector('input[name=mode]:checked').value; }

// kind: 'msg' (success), 'dry-run' (warning) or 'error' — styles in app.css
const ICONS = {{ {'msg': icon('circle-check'), 'dry-run': icon('alert-triangle'), 'error': icon('circle-x')} | tojson }};
function show(html, kind) {
  resultEl.innerHTML = `<div class="${kind}" role="${kind === 'error' ? 'alert' : 'status'}">${ICONS[kind] || ''}<span>${html}</span></div>`;
}

function updateBasket() {
  basketForm.hidden = !basket.size;
  document.getElementById('basket-count').textContent = basket.size;
  let total = 0, unweighed = 0, unpriced = 0;
  for (const p of basket.values()) {
    if (p.weight_kg == null && p.pieces == null) unweighed++;
    else if (p.total_price == null) unpriced++;
    else total += p.total_price;
  }
  const notes = [];
  if (unweighed) notes.push(T['{n} ohne Gewicht'].replace('{n}', unweighed));
  if (unpriced) notes.push(T['{n} ohne Preis'].replace('{n}', unpriced));
  document.getElementById('basket-summary').textContent =
    T['{n} Teilstücke, {total} €'].replace('{n}', basket.size).replace('{total}', fmt(total)) + (notes.length ? ` (${notes.join(', ')})` : '');
}

function addToBasket(p) {
  if (basket.has(p.uuid)) return false;
  basket.set(p.uuid, p);
  const li = document.createElement('li');
  const priceText = p.total_price == null ? esc(T['ohne Preis']) : `${fmt(p.total_price)} €`;
  li.innerHTML = `${p.species} – ${p.part}, ${amount(p)}, ${priceText} ` +
    `<input type="hidden" name="uuid" value="${p.uuid}" form="basket-form"> ` +
    `<button type="button" class="small icon-only" title="${esc(T['Aus dem Warenkorb entfernen'])}" aria-label="${esc(T['Aus dem Warenkorb entfernen'])}">{{ icon('trash-2') }}</button>`;
  li.querySelector('button').addEventListener('click', () => {
    basket.delete(p.uuid);
    li.remove();
    updateBasket();
  });
  basketEl.appendChild(li);
  updateBasket();
  return true;
}

async function onScan(text) {
  const now = Date.now();
  if (text === lastScan.text && now - lastScan.at < 5000) return;
  lastScan = { text, at: now };

  const uuid = text.trim().toLowerCase();
  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(uuid)) {
    show(esc(T['Kein gültiger Etiketten-Code']), 'error');
    return;
  }

  try {
    if (mode() === 'sell') {
      const resp = await fetch(`/parts/${encodeURIComponent(uuid)}.json`);
      const data = await resp.json();
      if (!data.ok) { show(esc(data.error), 'error'); return; }
      const p = data.part;
      const desc = `${p.species} – ${p.part}, ${amount(p)} (${p.uuid.slice(0, 8).toUpperCase()})`;
      if (p.consumed_at) {
        show(`${esc(T['Bereits entnommen am {date}:'].replace('{date}', p.consumed_at.slice(0, 10)))}<br><b>${desc}</b>`, 'dry-run');
      } else if (addToBasket(p)) {
        show(`${esc(T['Im Warenkorb:'])}<br><b>${desc}</b>`, 'msg');
        if (navigator.vibrate) navigator.vibrate(100);
      } else {
        show(`${esc(T['Schon im Warenkorb:'])}<br><b>${desc}</b>`, 'dry-run');
      }
      return;
    }

    const resp = await fetch(`/parts/${encodeURIComponent(uuid)}/consume`, { method: 'POST' });
    const data = await resp.json();
    if (!data.ok) {
      show(esc(data.error), 'error');
      return;
    }
    const p = data.part;
    const desc = `${p.species} – ${p.part}, ${amount(p)} (${p.uuid.slice(0, 8).toUpperCase()})`;
    if (data.already_consumed) {
      show(`${esc(T['Bereits entnommen am {date}:'].replace('{date}', p.consumed_at.slice(0, 10)))}<br><b>${desc}</b>`, 'dry-run');
    } else {
      show(`${esc(T['Entnommen:'])}<br><b>${desc}</b>`, 'msg');
      const li = document.createElement('li');
      li.textContent = desc;
      logEl.prepend(li);
      if (navigator.vibrate) navigator.vibrate(100);
    }
  } catch (e) {
    show(esc(T['Fehler — Verbindung prüfen']), 'error');
  }
}

document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', () => {
  document.getElementById('mode-hint').textContent = mode() === 'sell'
    ? T['QR-Etiketten scannen und in den Warenkorb legen — dann Verkauf abschließen.']
    : T['QR-Etikett vor die Kamera halten — das Teilstück wird aus dem Bestand ausgetragen.'];
}));

const scanner = new Html5Qrcode("reader");
const scanConfig = { fps: 10, qrbox: { width: 250, height: 250 } };

async function startScanner() {
  if (!window.isSecureContext) {
    show(esc(T['Kamera erfordert HTTPS oder localhost — Seite über http://localhost:8010/scan öffnen.']), 'error');
    return;
  }
  try {
    // getCameras triggers the permission prompt and lists real devices
    const cameras = await Html5Qrcode.getCameras();
    if (!cameras.length) throw new Error(T['Keine Kamera gefunden']);
    // prefer a back camera if present (phone), otherwise first camera (Mac)
    const back = cameras.find(c => /back|rear|rück/i.test(c.label));
    await scanner.start((back || cameras[0]).id, scanConfig, onScan, () => {});
  } catch (err) {
    show(esc(T['Kamera konnte nicht gestartet werden: {error}'].replace('{error}', () => err)) + '<br>' +
         esc(T['Kamerazugriff für den Browser erlauben (macOS: Systemeinstellungen → Datenschutz & Sicherheit → Kamera).']), 'error');
  }
}

startScanner();
</script>

{% endblock %}
