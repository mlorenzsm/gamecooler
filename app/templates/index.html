{% extends "base.html" %}
{% block content %}

{% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
{% if config.dry_run %}<div class="dry-run">Testmodus aktiv (dry_run) – es wird nicht gedruckt.</div>{% endif %}

<form class="part-form" method="post" action="/parts" id="part-form" onsubmit="return confirmPrint()">
  <label>Jäger
    <select name="hunter" required>
      {% for h in config.hunters %}<option>{{ h.name }}</option>{% endfor %}
    </select>
  </label>
  <label>Wildart
    <select name="species" required>
      {% for s in config.species %}<option>{{ s }}</option>{% endfor %}
    </select>
  </label>
  <label>Teilstück
    <select name="part" required id="part-select">
      {% for p in config.parts %}<option>{{ p }}</option>{% endfor %}
    </select>
  </label>
  <label>Gewicht (kg)
    <input name="weight_kg" required inputmode="decimal" pattern="[0-9]+([.,][0-9]+)?" placeholder="1,25">
  </label>
  <label>Preis/kg (€)
    <input name="price_per_kg" required inputmode="decimal" pattern="[0-9]+([.,][0-9]+)?" placeholder="12,50" id="price-input">
  </label>
  <button class="print" type="submit">2 Etiketten drucken &amp; registrieren</button>
</form>

<div class="preview-imgs" id="preview">
  <img id="preview-info" alt="Info-Etikett">
  <img id="preview-qr" alt="QR-Etikett">
</div>

<script>
const PARTS = {{ config.parts | tojson }};
const priceInput = document.getElementById('price-input');
const partSelect = document.getElementById('part-select');
function fillPrice() {
  priceInput.value = PARTS[partSelect.value].toFixed(2).replace('.', ',');
}
partSelect.addEventListener('change', fillPrice);
fillPrice();

function confirmPrint() {
  const form = document.getElementById('part-form');
  const d = new FormData(form);
  return confirm(`2 Etiketten drucken?\n\n${d.get('species')} – ${d.get('part')}, ${d.get('weight_kg')} kg zu ${d.get('price_per_kg')} €/kg`);
}

function showPreview() {
  const form = document.getElementById('part-form');
  const params = new URLSearchParams(new FormData(form));
  document.getElementById('preview-info').src = '/preview?' + params + '&type=info';
  document.getElementById('preview-qr').src = '/preview?' + params + '&type=qr';
}

let previewTimer;
function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(showPreview, 300);
}
const form = document.getElementById('part-form');
form.addEventListener('input', schedulePreview);
form.addEventListener('change', schedulePreview);
showPreview();
</script>

{% endblock %}
