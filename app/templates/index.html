{% extends "base.html" %}
{% block content %}

{% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
{% if config.dry_run %}<div class="dry-run">Testmodus aktiv (dry_run) – es wird nicht gedruckt.</div>{% endif %}

<form class="part-form" method="post" action="/parts" id="part-form" onsubmit="return confirmPrint()">
  <label>Jäger
    <select name="hunter" required>
      {% for h in config.hunters %}<option>{{ h.name }}</option>{% endfor %}
    </select>
  </label>
  <label>Wildart
    <select name="species" required>
      {% for s in config.species %}<option>{{ s }}</option>{% endfor %}
    </select>
  </label>
  <label>Teilstück
    <select name="part" required id="part-select">
      {% for p in config.parts %}<option>{{ p }}</option>{% endfor %}
    </select>
  </label>
  <label>Gewicht (kg) <span style="font-weight:400; color:#888;">(leer = kein Gewicht auf dem Etikett)</span>
    <input name="weight_kg" inputmode="decimal" pattern="[0-9]+([.,][0-9]+)?" placeholder="1,25" id="weight-input">
  </label>
  <label>Preis/kg (€) <span style="font-weight:400; color:#888;">(leer = kein Preis auf dem Etikett)</span>
    <input name="price_per_kg" inputmode="decimal" pattern="[0-9]+([.,][0-9]+)?" placeholder="12,50" id="price-input">
  </label>
  {% if config.printers | length > 1 %}
  <label>Drucker
    <select name="printer">
      {% for p in config.printers %}
      <option value="{{ p.name }}" {% if p.name == config.default_printer %}selected{% endif %}>{{ p.name }}</option>
      {% endfor %}
    </select>
  </label>
  {% endif %}
  <button class="print" type="submit">2 Etiketten drucken &amp; registrieren</button>
</form>

<div class="preview-imgs" id="preview">
  <img id="preview-info" alt="Info-Etikett">
  <img id="preview-qr" alt="QR-Etikett">
</div>

<script>
const PARTS = {{ config.parts | parts_json | tojson }};
const priceInput = document.getElementById('price-input');
const weightInput = document.getElementById('weight-input');
const partSelect = document.getElementById('part-select');
function fillDefaults() {
  const p = PARTS[partSelect.value];
  priceInput.value = p.price != null ? p.price.toFixed(2).replace('.', ',') : '';
  weightInput.value = p.weight_kg != null ? p.weight_kg.toFixed(3).replace('.', ',') : '';
}
partSelect.addEventListener('change', fillDefaults);
fillDefaults();

function confirmPrint() {
  const form = document.getElementById('part-form');
  const d = new FormData(form);
  const weight = d.get('weight_kg');
  const price = d.get('price_per_kg');
  let details = 'ohne Gewicht und Preis';
  if (weight) details = `${weight} kg ` + (price ? `zu ${price} €/kg` : 'ohne Preis');
  return confirm(`2 Etiketten drucken?\n\n${d.get('species')} – ${d.get('part')}, ${details}`);
}

function showPreview() {
  const form = document.getElementById('part-form');
  const params = new URLSearchParams(new FormData(form));
  document.getElementById('preview-info').src = '/preview?' + params + '&type=info';
  document.getElementById('preview-qr').src = '/preview?' + params + '&type=qr';
}

let previewTimer;
function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(showPreview, 300);
}
const form = document.getElementById('part-form');
form.addEventListener('input', schedulePreview);
form.addEventListener('change', schedulePreview);
showPreview();
</script>

{% endblock %}
